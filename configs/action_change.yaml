# Orbit Wars PPO Training Configuration
# Usage: python -m rl.train --config configs/default.yaml
# CLI arguments override values in this file

game:
  board_size: 100.0
  center_x: 50.0
  center_y: 50.0
  sun_radius: 10.0

obs:
  max_planets: 48
  max_fleets: 64
  planet_features: 14
  fleet_features: 12
  global_features: 9

action:
  max_sources: 4
  max_targets: 4
  ship_fractions: [0.25, 0.5, 0.75, 1.0]
  ship_intercepts: [0, 1, 2, 3, 4]
  max_launches_per_source: 2
  epsilon: 0.0                  # ε-greedy exploration (0 = pure argmax, 1 = pure random)

model:
  model_type: "gnn"       # "mlp" (baseline) or "gnn" (GNN+Attention)
  hidden_sizes: [512, 512, 256]  # only used by mlp model
  dropout: 0.1
  gnn:
    gcn_dims: [512, 384, 256]
    fleet_attn_dims: [512, 256, 128]
    cross_attn_dims: [512, 384, 256]



reward:
  fleet_advantage_scale: 2.0e-4      # economy: (my_fleets - enemy_fleets) per step
  production_advantage_scale: 0.01   # economy: my_prod*log(my_prod) - enemy_prod*log(enemy_prod)
  terminal_economy_scale: 0.1        # economy terminal: my_fleets / total_board_production
  out_of_boundary_penalty_scale: 0.02
  suicide_penalty_scale: 0.05
  planet_count_scale: 0.01          # +0.03 per extra planet owned per step (was 0.02)
  territory_scale: 1.5              # base reward per capture / loss event
  production_weight: 0.5            # quality multiplier: 1 + prod × weight
  enemy_capture_bonus: 3.0          # enemy→me multiplier (hardest, biggest reward)
  territory_loss_penalty: 2.0        # me→enemy penalty multiplier (worst loss)
  no_action_penalty_scale: 0.03     # penalty per idle step after grace (match economy scale)
  no_action_grace_steps: 30          # consecutive idle steps before penalty (was 20)
  launch_bonus_scale: 5.0e-4     # +5e-4 per ship launched — dense signal bridging launch→capture gap
  defense_success_scale: 0.005   # +0.005 per enemy ship destroyed while defending
  fleet_arrival_scale: 0.005     # +0.005 per ship that reached enemy/neutral planet
  terminal_win_scale: 50.0
  terminal_lose_scale: -50.0
  invalid_action_penalty: 0.1
  only_economy: false

env:
  num_players: 2
  episode_steps: 500
  act_timeout: 1
  seed: null
  debug: false

train:
  seed: 0

  # ── Data scale ──
  num_envs: 10
  rollout_steps: 64
  total_updates: 20000

  # ── Credit assignment ──
  gamma: 0.99
  gae_lambda: 0.95

  # ── PPO clipping ──
  clip_range: 0.2
  
  # ── Optimisation ──
  learning_rate: 2.0e-4
  max_grad_norm: 0.5

  # ── Loss weights ──
  ent_coef: 0.01
  vf_coef: 1.0
  value_reg: 0.0001                # L2 penalty on value output — prevents collapse to constant

  # ── Training schedule ──
  batch_size: 128
  epochs: 3

  # ── Checkpoint & opponent ──
  save_every: 20                 # faster opponent-pool refresh (was 50)
  opponent_refresh: 5            # more frequent opponent rotation (was 5)
  opponent_pool_capacity: 3
  opponent_rule_prob: 0.8        # 30% chance of rule-based opponent (vs. policy opponent)
